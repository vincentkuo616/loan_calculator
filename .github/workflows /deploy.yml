name: Deploy Loan Calculator to GitHub Pages

on:
  push:
    branches: ["main"] # 只要更新程式碼推上 main，立刻自動發布
  workflow_dispatch:     # 允許手動點擊執行

# 🛡️ 安全權限閘門 (Pages 部署必備)
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同一時間只有一個部署作業在執行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 複製專案代碼
        uses: actions/checkout@v4

      - name: 🌐 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 打包靜態網頁資產
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 打包根目錄下的 index.html

      - name: 🚀 正式發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
